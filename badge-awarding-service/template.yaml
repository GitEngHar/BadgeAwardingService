AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  badge-awarding-service

  Sample SAM Template for badge-awarding-service

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Tracing: Active
    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true

Resources:
  ############################################################
  # Lambda
  ############################################################
  BadgeFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: go-app
      Handler: cmd
      Runtime: provided.al2023
      Architectures:
      - x86_64
      Events:
        CatchProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Sub arn:aws:sns:ap-northeast-1:${AWS::AccountId}:TestMailTopic
          TABLE_NAME: !Ref BadgeTable
          TABLE_ARN: !GetAtt BadgeTable.Arn
          QUEUE_URL: !Ref BadgeQueue
          QUEUE_ARN: !GetAtt BadgeQueue.Arn
          ENVIRONMENT: "PROD"
      Policies:
        # DynamoDB CRUD 権限（対象テーブル限定）
        - DynamoDBCrudPolicy:
            TableName: !Ref BadgeTable
        # SQS 送信権限（対象キュー限定）
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BadgeQueue.QueueName
    ############################################################
    # SQS (Main + DLQ)
    ############################################################
  BadgeQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub badge-awarding-dlq-${AWS::StackName}

  BadgeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub badge-awarding-queue-${AWS::StackName}
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BadgeQueueDLQ.Arn
        maxReceiveCount: 5

    ############################################################
    # DynamoDB
    ############################################################
  BadgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub badge-awarding-table-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for Prod
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  BadgeFunctionArn:
    Description: Badge Lambda Function ARN
    Value: !GetAtt BadgeFunction.Arn
  BadgeFunctionRoleArn:
    Description: IAM Role for BadgeFunction
    Value: !GetAtt BadgeFunctionRole.Arn

  # SQS
  BadgeQueueUrl:
    Description: SQS Queue URL
    Value: !Ref BadgeQueue
  BadgeQueueArn:
    Description: SQS Queue ARN
    Value: !GetAtt BadgeQueue.Arn
  BadgeQueueDLQUrl:
    Description: DLQ URL
    Value: !Ref BadgeQueueDLQ
  BadgeQueueDLQArn:
    Description: DLQ ARN
    Value: !GetAtt BadgeQueueDLQ.Arn

  # DynamoDB
  BadgeTableName:
    Description: DynamoDB Table Name
    Value: !Ref BadgeTable
  BadgeTableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt BadgeTable.Arn
