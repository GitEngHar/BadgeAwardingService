AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'badge-awarding-service

  Sample SAM Template for badge-awarding-service

  '
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  BadgeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: BadgeFunction
    Properties:
      CodeUri: BadgeFunction
      Handler: cmd
      Runtime: provided.al2023
      Architectures:
      - x86_64
      Events:
        CatchProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Fn::Sub: arn:aws:sns:ap-northeast-1:${AWS::AccountId}:TestMailTopic
          TABLE_NAME:
            Ref: BadgeTable
          TABLE_ARN:
            Fn::GetAtt:
            - BadgeTable
            - Arn
          QUEUE_URL:
            Ref: BadgeQueue
          QUEUE_ARN:
            Fn::GetAtt:
            - BadgeQueue
            - Arn
          ENVIRONMENT: PROD
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BadgeTable
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - BadgeQueue
            - QueueName
  BadgeQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: badge-awarding-dlq-${AWS::StackName}
  BadgeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: badge-awarding-queue-${AWS::StackName}
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - BadgeQueueDLQ
          - Arn
        maxReceiveCount: 5
  BadgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: badge-awarding-table-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for Prod
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  BadgeFunctionArn:
    Description: Badge Lambda Function ARN
    Value:
      Fn::GetAtt:
      - BadgeFunction
      - Arn
  BadgeFunctionRoleArn:
    Description: IAM Role for BadgeFunction
    Value:
      Fn::GetAtt:
      - BadgeFunctionRole
      - Arn
  BadgeQueueUrl:
    Description: SQS Queue URL
    Value:
      Ref: BadgeQueue
  BadgeQueueArn:
    Description: SQS Queue ARN
    Value:
      Fn::GetAtt:
      - BadgeQueue
      - Arn
  BadgeQueueDLQUrl:
    Description: DLQ URL
    Value:
      Ref: BadgeQueueDLQ
  BadgeQueueDLQArn:
    Description: DLQ ARN
    Value:
      Fn::GetAtt:
      - BadgeQueueDLQ
      - Arn
  BadgeTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: BadgeTable
  BadgeTableArn:
    Description: DynamoDB Table ARN
    Value:
      Fn::GetAtt:
      - BadgeTable
      - Arn
